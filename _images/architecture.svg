<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" version="1.1">
  <defs>
    <style>
      .input-box { fill: #ffffff; stroke: #64748b; stroke-width: 2; rx: 10; ry: 10; }
      .prepare-box { fill: #E0F2FE; stroke: #0EA5E9; stroke-width: 2; rx: 12; ry: 12; }
      .create-box { fill: #F0FDF4; stroke: #16A34A; stroke-width: 2; rx: 12; ry: 12; }
      .result-box { fill: #ffffff; stroke: #16A34A; stroke-width: 2; rx: 10; ry: 10; }
      .title { font-family: Helvetica, Arial, sans-serif; font-size: 22px; font-weight: bold; fill: #0f172a; }
      .label { font-family: Helvetica, Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #0f172a; }
      .subtext { font-family: Helvetica, Arial, sans-serif; font-size: 13px; fill: #475569; }
      .arrow { stroke: #475569; stroke-width: 2.5; fill: none; }
      .arrow-head { fill: #475569; }
      .center { text-anchor: middle; dominant-baseline: middle; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" class="arrow-head" />
    </marker>
  </defs>

  <text x="400" y="40" class="title center">KIWI NG Architecture</text>

  <rect x="50" y="80" width="230" height="90" class="input-box" />
  <text x="165" y="112" class="label center">Image description</text>
  <text x="165" y="140" class="subtext center">config.xml or *.kiwi</text>

  <rect x="520" y="80" width="230" height="90" class="input-box" />
  <text x="635" y="112" class="label center">Repositories</text>
  <text x="635" y="140" class="subtext center">Packages used for the build</text>

  <line x1="280" y1="125" x2="330" y2="125" class="arrow" marker-end="url(#arrowhead)" />
  <line x1="520" y1="125" x2="470" y2="125" class="arrow" marker-end="url(#arrowhead)" />

  <rect x="330" y="75" width="140" height="100" class="prepare-box" />
  <text x="400" y="110" class="label center">Prepare</text>
  <text x="400" y="140" class="subtext center">Create a new root</text>

  <line x1="400" y1="175" x2="400" y2="220" class="arrow" marker-end="url(#arrowhead)" />

  <rect x="285" y="220" width="230" height="80" class="input-box" />
  <text x="400" y="260" class="label center">Prepared root tree</text>

  <line x1="400" y1="300" x2="400" y2="335" class="arrow" marker-end="url(#arrowhead)" />

  <rect x="330" y="335" width="140" height="70" class="create-box" />
  <text x="400" y="370" class="label center">Create</text>

  <line x1="470" y1="370" x2="550" y2="370" class="arrow" marker-end="url(#arrowhead)" />

  <rect x="550" y="325" width="200" height="90" class="result-box" />
  <text x="650" y="357" class="label center">One or more images</text>
  <text x="650" y="385" class="subtext center">disk, ISO, container</text>
</svg>
