<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1098" viewBox="0 0 800 1098" version="1.1">
  <title>KIWI NG build process: the prepare and the create step</title>
  <defs>
    <style>
      .input-box { fill: #ffffff; stroke: #64748b; stroke-width: 2; rx: 10; ry: 10; }
      .prepare-lane { fill: #F8FCFF; stroke: #0EA5E9; stroke-width: 2; rx: 14; ry: 14; }
      .create-lane { fill: #FAFFFB; stroke: #16A34A; stroke-width: 2; rx: 14; ry: 14; }
      .prepare-step { fill: #E0F2FE; stroke: #0EA5E9; stroke-width: 1.5; rx: 8; ry: 8; }
      .create-step { fill: #F0FDF4; stroke: #16A34A; stroke-width: 1.5; rx: 8; ry: 8; }
      .script { fill: #FEF3C7; stroke: #D97706; stroke-width: 1.5; rx: 15; ry: 15; }
      .result-box { fill: #ffffff; stroke: #0EA5E9; stroke-width: 2; rx: 10; ry: 10; }
      .image-box { fill: #ffffff; stroke: #16A34A; stroke-width: 2; rx: 10; ry: 10; }
      .title { font-family: Helvetica, Arial, sans-serif; font-size: 22px; font-weight: bold; fill: #0f172a; }
      .lane-title { font-family: Helvetica, Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #0f172a; }
      .command { font-family: "DejaVu Sans Mono", Menlo, Consolas, monospace; font-size: 13px; fill: #475569; }
      .label { font-family: Helvetica, Arial, sans-serif; font-size: 15px; font-weight: bold; fill: #0f172a; }
      .subtext { font-family: Helvetica, Arial, sans-serif; font-size: 12px; fill: #475569; }
      .script-text { font-family: "DejaVu Sans Mono", Menlo, Consolas, monospace; font-size: 13px; font-weight: bold; fill: #92400e; }
      .note { font-family: Helvetica, Arial, sans-serif; font-size: 12px; font-style: italic; fill: #64748b; }
      .arrow { stroke: #475569; stroke-width: 2; fill: none; }
      .arrow-head { fill: #475569; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" class="arrow-head" />
    </marker>
  </defs>

  <text x="400" y="34" class="title" text-anchor="middle">KIWI NG Build Process</text>
  <rect x="120" y="58" width="200" height="50" class="input-box" />
  <text x="220" y="79" class="label" text-anchor="middle">Image description</text>
  <text x="220" y="97" class="subtext" text-anchor="middle">config.xml or *.kiwi</text>
  <rect x="480" y="58" width="200" height="50" class="input-box" />
  <text x="580" y="79" class="label" text-anchor="middle">Repositories</text>
  <text x="580" y="97" class="subtext" text-anchor="middle">packages for the build</text>
  <path d="M 220 108 L 220 122 L 370 122 L 370 150" class="arrow" marker-end="url(#arrowhead)" />
  <path d="M 580 108 L 580 122 L 430 122 L 430 150" class="arrow" marker-end="url(#arrowhead)" />
  <rect x="60" y="140" width="680" height="578" class="prepare-lane" />
  <text x="80" y="168" class="lane-title">Prepare</text>
  <text x="720" y="168" class="command" text-anchor="end">kiwi-ng system prepare</text>
  <rect x="190" y="184" width="420" height="36" class="prepare-step" />
  <text x="400" y="207" class="label" text-anchor="middle">Create the root directory</text>
  <line x1="400" y1="220" x2="400" y2="242" class="arrow" marker-end="url(#arrowhead)" />
  <rect x="190" y="244" width="420" height="50" class="prepare-step" />
  <text x="400" y="265" class="label" text-anchor="middle">Bootstrap the root tree</text>
  <text x="400" y="283" class="subtext" text-anchor="middle">bootstrap packages, with the package manager of the host</text>
  <line x1="400" y1="294" x2="400" y2="316" class="arrow" marker-end="url(#arrowhead)" />
  <rect x="290" y="318" width="220" height="30" class="script" />
  <text x="400" y="338" class="script-text" text-anchor="middle">post_bootstrap.sh</text>
  <text x="522" y="338" class="note">optional script</text>
  <line x1="400" y1="348" x2="400" y2="370" class="arrow" marker-end="url(#arrowhead)" />
  <rect x="190" y="372" width="420" height="50" class="prepare-step" />
  <text x="400" y="393" class="label" text-anchor="middle">Install packages and archives</text>
  <text x="400" y="411" class="subtext" text-anchor="middle">image packages, inside of the root tree (chroot)</text>
  <line x1="400" y1="422" x2="400" y2="444" class="arrow" marker-end="url(#arrowhead)" />
  <rect x="190" y="446" width="420" height="50" class="prepare-step" />
  <text x="400" y="467" class="label" text-anchor="middle">Apply the overlay tree</text>
  <text x="400" y="485" class="subtext" text-anchor="middle">root/ or root.tar.gz, overwrites existing files</text>
  <line x1="400" y1="496" x2="400" y2="518" class="arrow" marker-end="url(#arrowhead)" />
  <rect x="190" y="520" width="420" height="50" class="prepare-step" />
  <text x="400" y="541" class="label" text-anchor="middle">Set up users and system settings</text>
  <text x="400" y="559" class="subtext" text-anchor="middle">users, groups, keyboard, locale, timezone, ...</text>
  <line x1="400" y1="570" x2="400" y2="592" class="arrow" marker-end="url(#arrowhead)" />
  <rect x="290" y="594" width="220" height="30" class="script" />
  <text x="400" y="614" class="script-text" text-anchor="middle">config.sh</text>
  <text x="522" y="614" class="note">optional script</text>
  <line x1="400" y1="624" x2="400" y2="646" class="arrow" marker-end="url(#arrowhead)" />
  <rect x="190" y="648" width="420" height="50" class="prepare-step" />
  <text x="400" y="669" class="label" text-anchor="middle">Remove packages</text>
  <text x="400" y="687" class="subtext" text-anchor="middle">packages of type uninstall and delete</text>
  <line x1="400" y1="718" x2="400" y2="740" class="arrow" marker-end="url(#arrowhead)" />
  <rect x="250" y="742" width="300" height="50" class="result-box" />
  <text x="400" y="763" class="label" text-anchor="middle">Root tree</text>
  <text x="400" y="781" class="subtext" text-anchor="middle">the future filesystem of the image</text>
  <text x="562" y="763" class="note">can be modified</text>
  <text x="562" y="779" class="note">before the create step</text>
  <line x1="400" y1="792" x2="400" y2="814" class="arrow" marker-end="url(#arrowhead)" />
  <rect x="60" y="816" width="680" height="184" class="create-lane" />
  <text x="80" y="844" class="lane-title">Create</text>
  <text x="720" y="844" class="command" text-anchor="end">kiwi-ng system create</text>
  <rect x="290" y="860" width="220" height="30" class="script" />
  <text x="400" y="880" class="script-text" text-anchor="middle">images.sh</text>
  <text x="522" y="880" class="note">optional script</text>
  <line x1="400" y1="890" x2="400" y2="912" class="arrow" marker-end="url(#arrowhead)" />
  <rect x="190" y="914" width="420" height="66" class="create-step" />
  <text x="400" y="935" class="label" text-anchor="middle">Build the image types</text>
  <text x="400" y="953" class="subtext" text-anchor="middle">disk images run pre_disk_sync.sh and disk.sh,</text>
  <text x="400" y="969" class="subtext" text-anchor="middle">ISO images get the CD root user data</text>
  <line x1="400" y1="1000" x2="400" y2="1022" class="arrow" marker-end="url(#arrowhead)" />
  <rect x="250" y="1024" width="300" height="50" class="image-box" />
  <text x="400" y="1045" class="label" text-anchor="middle">One or more images</text>
  <text x="400" y="1063" class="subtext" text-anchor="middle">disk, ISO, container, ...</text>
</svg>
