<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380" version="1.1">
  <title>Settings used when building with the QEMU profile</title>
  <defs>
    <style>
      .description { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 8 5; rx: 14; ry: 14; }
      .used { fill: #E0F2FE; stroke: #0EA5E9; stroke-width: 1.5; rx: 8; ry: 8; }
      .unused { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 5 4; rx: 8; ry: 8; }
      .command { fill: #0f172a; rx: 19; ry: 19; }
      .result { fill: #F0FDF4; stroke: #16A34A; stroke-width: 2; rx: 10; ry: 10; }
      .title { font-family: Helvetica, Arial, sans-serif; font-size: 22px; font-weight: bold; fill: #0f172a; }
      .group { font-family: Helvetica, Arial, sans-serif; font-size: 15px; font-weight: bold; fill: #475569; }
      .label { font-family: Helvetica, Arial, sans-serif; font-size: 15px; font-weight: bold; fill: #0f172a; }
      .label-unused { font-family: Helvetica, Arial, sans-serif; font-size: 15px; font-weight: bold; fill: #94a3b8; }
      .subtext { font-family: Helvetica, Arial, sans-serif; font-size: 12px; fill: #475569; }
      .subtext-dark { font-family: Helvetica, Arial, sans-serif; font-size: 13px; fill: #0f172a; }
      .command-text { font-family: "DejaVu Sans Mono", Menlo, Consolas, monospace; font-size: 14px; font-weight: bold; fill: #ffffff; }
      .arrow { stroke: #475569; stroke-width: 2; fill: none; }
      .arrow-head { fill: #475569; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" class="arrow-head" />
    </marker>
  </defs>
  <text x="400" y="34" class="title" text-anchor="middle">Building with a Profile</text>
  <rect x="30" y="58" width="350" height="300" class="description" />
  <text x="50" y="84" class="group" text-anchor="start">Image description</text>
  <rect x="50" y="100" width="310" height="50" class="used" />
  <text x="205" y="121" class="label" text-anchor="middle">Settings without profiles</text>
  <text x="205" y="139" class="subtext" text-anchor="middle">used by every build</text>
  <path d="M 360 125 C 390 125, 390 207, 420 207" class="arrow" />
  <rect x="50" y="164" width="310" height="50" class="used" />
  <text x="205" y="185" class="label" text-anchor="middle">profiles=&quot;VM&quot;</text>
  <text x="205" y="203" class="subtext" text-anchor="middle">required by the QEMU profile</text>
  <path d="M 360 189 C 390 189, 390 207, 420 207" class="arrow" />
  <rect x="50" y="228" width="310" height="50" class="used" />
  <text x="205" y="249" class="label" text-anchor="middle">profiles=&quot;QEMU&quot;</text>
  <text x="205" y="267" class="subtext" text-anchor="middle">&lt;requires profile=&quot;VM&quot;/&gt;</text>
  <path d="M 360 253 C 390 253, 390 207, 420 207" class="arrow" />
  <rect x="50" y="292" width="310" height="50" class="unused" />
  <text x="205" y="313" class="label-unused" text-anchor="middle">profiles=&quot;VMWare&quot;</text>
  <text x="205" y="331" class="subtext" text-anchor="middle">not used for this build</text>
  <rect x="420" y="188" width="150" height="38" class="command" />
  <text x="495" y="212" class="command-text" text-anchor="middle">--profile QEMU</text>
  <line x1="570" y1="207" x2="604" y2="207" class="arrow" marker-end="url(#arrowhead)" />
  <rect x="606" y="140" width="170" height="134" class="result" />
  <text x="691" y="166" class="label" text-anchor="middle">The build uses</text>
  <text x="691" y="196" class="subtext-dark" text-anchor="middle">settings without profiles</text>
  <text x="691" y="220" class="subtext-dark" text-anchor="middle">+ settings of VM</text>
  <text x="691" y="244" class="subtext-dark" text-anchor="middle">+ settings of QEMU</text>
</svg>
